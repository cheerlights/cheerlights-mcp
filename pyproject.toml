[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cheerlights-mcp"
version = "3.0.0"
description = "MCP server that lets AI assistants read the live CheerLights color, its history, and statistics"
authors = [{ name = "CheerLights Community", email = "info@cheerlights.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "cheerlights", "iot", "thingspeak"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.28",
    "pydantic>=2.12",
]

[project.urls]
Homepage = "https://cheerlights.com"
Repository = "https://github.com/cheerlights/cheerlights-mcp"
Issues = "https://github.com/cheerlights/cheerlights-mcp/issues"

[project.scripts]
cheerlights-mcp = "cheerlights_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cheerlights_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
